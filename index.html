
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Notes Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Your simple online notes manager</p>
    </header>

    <main>
        <section class="notes-section">
            <h2>Your Notes</h2>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite"></p>

            <ul id="notes-list"></ul>
        </section>

        <section class="form-section">
            <h2>Create a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title</label>
                    <input
                        type="text"
                        id="title-input"
                        name="title"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note body (optional)</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="5"
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>
    </main>

    <footer>
        <p>QuickNotes System Design Project</p>
    </footer>
</body>
</html>
